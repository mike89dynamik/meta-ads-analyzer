<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --orange: #e37739;
        --white: #ffffff;
        --ink: #1f1b18;
        --font-display: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--orange);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        background: var(--orange);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="23.5"
      data-width="1080"
      data-height="1920"
    >
      <!-- scenes -->
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html"
        data-start="0" data-duration="6.1" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html"
        data-start="6.1" data-duration="3.65" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html"
        data-start="9.75" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html"
        data-start="13.75" data-duration="4.3" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html"
        data-start="18.05" data-duration="5.45" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>

      <!-- captions -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="23.5" data-track-index="2" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index:5"></div>

      <!-- voice -->
      <audio id="vo" class="clip" src="assets/narration.wav" data-start="0" data-duration="23.5"
        data-track-index="3" data-volume="1"></audio>

      <!-- sfx -->
      <audio id="sfx-stamp" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="2.86" data-duration="2.1" data-track-index="5" data-volume="0.55"></audio>
      <audio id="sfx-notif-2" class="clip" src="assets/sfx/notification.mp3" data-start="3.9" data-duration="1.5" data-track-index="4" data-volume="0.4"></audio>
      <audio id="sfx-whoosh-1" class="clip" src="assets/sfx/whoosh.mp3" data-start="5.97" data-duration="0.4" data-track-index="6" data-volume="0.35"></audio>
      <audio id="sfx-pop-1" class="clip" src="assets/sfx/pop.mp3" data-start="7.57" data-duration="0.3" data-track-index="7" data-volume="0.8"></audio>
      <audio id="sfx-tick-1" class="clip" src="assets/sfx/key-press.mp3" data-start="10.71" data-duration="0.2" data-track-index="8" data-volume="2.5"></audio>
      <audio id="sfx-tick-2" class="clip" src="assets/sfx/key-press.mp3" data-start="11.16" data-duration="0.2" data-track-index="8" data-volume="2.5"></audio>
      <audio id="sfx-tick-3" class="clip" src="assets/sfx/key-press.mp3" data-start="11.61" data-duration="0.2" data-track-index="8" data-volume="2.5"></audio>
      <audio id="sfx-tick-4" class="clip" src="assets/sfx/key-press.mp3" data-start="12.06" data-duration="0.2" data-track-index="8" data-volume="2.5"></audio>
      <audio id="sfx-whoosh-2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="13.62" data-duration="0.4" data-track-index="6" data-volume="0.3"></audio>
      <audio id="sfx-pop-2" class="clip" src="assets/sfx/pop.mp3" data-start="15.68" data-duration="0.3" data-track-index="7" data-volume="0.8"></audio>
      <audio id="sfx-whoosh-3" class="clip" src="assets/sfx/whoosh.mp3" data-start="17.92" data-duration="0.4" data-track-index="6" data-volume="0.3"></audio>
      <audio id="sfx-click" class="clip" src="assets/sfx/click.mp3" data-start="20.28" data-duration="0.3" data-track-index="7" data-volume="0.9"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
